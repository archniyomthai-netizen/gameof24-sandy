<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>24 Game</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-subtle: #f8f9fa;
      --border: #e5e7eb;
      --cross-line: #d1d5db;
      --ink: #111827;
      --muted: #6b7280;
      --accent: #111827;
      --accent-ink: #ffffff;
      --radius: 20px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --board-size: min(80vw, 68vh);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }

    .app-shell {
      width: 80vw;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-4);
    }

    header {
      text-align: center;
    }

    .subtitle {
      margin: 0;
      font-size: clamp(14px, 1.8vmin, 18px);
      color: var(--muted);
    }

    /* Cross & Quadrants Card (~80% of screen display) */
    .board {
      position: relative;
      width: var(--board-size);
      height: var(--board-size);
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      padding: var(--space-4);
    }

    /* Minimal Cross Divider (+ shape dividing 4 quadrants) */
    .board::before,
    .board::after {
      content: "";
      position: absolute;
      background: var(--cross-line);
      pointer-events: none;
    }

    /* Vertical line of the cross */
    .board::before {
      top: 6%;
      bottom: 6%;
      left: 50%;
      width: 2px;
      transform: translateX(-50%);
    }

    /* Horizontal line of the cross */
    .board::after {
      left: 6%;
      right: 6%;
      top: 50%;
      height: 2px;
      transform: translateY(-50%);
    }

    /* Center target indicator on the cross intersection */
    .cross-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(40px, 7vmin, 64px);
      height: clamp(40px, 7vmin, 64px);
      border-radius: 50%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(14px, 2.4vmin, 22px);
      font-weight: 600;
      color: var(--muted);
      z-index: 2;
      user-select: none;
    }

    .quadrant {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(64px, 20vmin, 200px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--ink);
      user-select: none;
      transition: opacity 0.18s ease;
    }

    /* Controls */
    .actions {
      width: var(--board-size);
      display: flex;
      gap: var(--space-3);
    }

    .btn {
      flex: 1;
      font: inherit;
      font-size: clamp(15px, 2vmin, 18px);
      font-weight: 500;
      padding: 14px 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.08s ease;
    }

    .btn:hover {
      background: var(--surface-subtle);
      border-color: #cbd5e1;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: #1f2937;
      border-color: #1f2937;
    }

    /* Solution Panel */
    .solution-panel {
      width: var(--board-size);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: var(--space-4) var(--space-6);
      background: var(--surface-subtle);
      display: none;
    }

    .solution-panel.visible {
      display: block;
    }

    .solution-title {
      margin: 0 0 var(--space-2);
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .solution-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .solution-list li {
      font-size: clamp(16px, 2.2vmin, 20px);
      font-weight: 500;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }

    .solution-list li:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header>
      <p class="subtitle">Use all 4 numbers with +, −, ×, ÷ to make 24</p>
    </header>

    <section class="board" aria-label="4-Number Board">
      <div class="quadrant" id="q1" aria-label="Top-left quadrant"></div>
      <div class="quadrant" id="q2" aria-label="Top-right quadrant"></div>
      <div class="quadrant" id="q3" aria-label="Bottom-left quadrant"></div>
      <div class="quadrant" id="q4" aria-label="Bottom-right quadrant"></div>
      <div class="cross-center" aria-hidden="true">24</div>
    </section>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="actionBtn">Show Solution</button>
    </div>

    <section class="solution-panel" id="solutionPanel" aria-live="polite">
      <h2 class="solution-title">Solutions (Integer Only)</h2>
      <ul class="solution-list" id="solutionList"></ul>
    </section>
  </main>

  <script>
    (function () {
      const TARGET = 24;
      const OPS = ['+', '-', '×', '÷'];

      // Apply integer-only arithmetic; returns null if invalid, negative, or fractional
      function computeStep(a, b, op) {
        if (op === '+') return a + b;
        if (op === '-') {
          const diff = a - b;
          return diff >= 0 ? diff : null;
        }
        if (op === '×') return a * b;
        if (op === '÷') {
          if (b <= 0 || a % b !== 0) return null;
          return a / b;
        }
        return null;
      }

      // Generate a canonical key for an expression tree to deduplicate commutative & associative rearrangements
      function makeNode(val, expr, key, opRank, opType, parts) {
        return { val, expr, key, opRank, opType, parts };
      }

      function combineNodes(left, right, op) {
        const val = computeStep(left.val, right.val, op);
        if (val === null) return null;

        let leftExpr = left.expr;
        let rightExpr = right.expr;

        const rank = (op === '+' || op === '-') ? 1 : 2;

        if (left.opRank > 0 && left.opRank < rank) {
          leftExpr = `(${leftExpr})`;
        }
        if (right.opRank > 0 && (right.opRank < rank || (right.opRank === rank && (op === '-' || op === '÷')))) {
          rightExpr = `(${rightExpr})`;
        }

        const expr = `${leftExpr} ${op} ${rightExpr}`;

        // Canonical signature that flattens associative + / - and × chains
        // so that (a + b) + c and a + (b + c) are recognized as the same method
        let key;
        let opType = op;
        let parts = [];

        if (op === '+' || op === '-') {
          opType = 'addsub';
          const leftParts = left.opType === 'addsub' ? left.parts : [`+${left.key}`];
          const rightParts = right.opType === 'addsub' ? right.parts : [`+${right.key}`];
          const flippedRight = op === '+'
            ? rightParts
            : rightParts.map(p => (p[0] === '+' ? '-' + p.slice(1) : '+' + p.slice(1)));
          parts = leftParts.concat(flippedRight).slice().sort();
          key = `AS(${parts.join('')})`;
        } else if (op === '×') {
          opType = 'mul';
          const leftParts = left.opType === 'mul' ? left.parts : [left.key];
          const rightParts = right.opType === 'mul' ? right.parts : [right.key];
          parts = leftParts.concat(rightParts).slice().sort();
          key = `M(${parts.join('×')})`;
        } else {
          opType = 'div';
          key = `D(${left.key}÷${right.key})`;
        }

        return makeNode(val, expr, key, rank, opType, parts);
      }

      // Find all distinct integer-only solutions for a 4-tuple
      function findIntegerSolutions(nums) {
        const solutionsMap = new Map();

        function search(nodes) {
          if (nodes.length === 1) {
            if (nodes[0].val === TARGET) {
              if (!solutionsMap.has(nodes[0].key)) {
                solutionsMap.set(nodes[0].key, `${nodes[0].expr} = 24`);
              }
            }
            return;
          }

          for (let i = 0; i < nodes.length; i++) {
            for (let j = 0; j < nodes.length; j++) {
              if (i === j) continue;

              const rest = [];
              for (let k = 0; k < nodes.length; k++) {
                if (k !== i && k !== j) rest.push(nodes[k]);
              }

              for (const op of OPS) {
                // Commutative ops only need i < j
                if ((op === '+' || op === '×') && i > j) continue;

                const combined = combineNodes(nodes[i], nodes[j], op);
                if (combined !== null) {
                  rest.push(combined);
                  search(rest);
                  rest.pop();
                }
              }
            }
          }
        }

        const initialNodes = nums.map(n => makeNode(n, String(n), String(n), 0));
        search(initialNodes);
        return Array.from(solutionsMap.values());
      }

      // Build valid easy puzzle pool (digits 1..9, no 0, no fractions, >= 2 distinct solutions)
      const puzzlePool = [];

      function buildPool() {
        for (let a = 1; a <= 9; a++) {
          for (let b = a; b <= 9; b++) {
            for (let c = b; c <= 9; c++) {
              for (let d = c; d <= 9; d++) {
                const tuple = [a, b, c, d];
                const sols = findIntegerSolutions(tuple);
                if (sols.length >= 2) {
                  // Prioritize puzzles that also have simple addition/subtraction or low-operator complexity
                  const hasAddSubOnly = sols.some(s => !s.includes('×') && !s.includes('÷'));
                  const hasNoDiv = sols.some(s => !s.includes('÷'));
                  if (hasAddSubOnly || hasNoDiv) {
                    // Sort solutions so easiest (no division/multiplication first) appear at top
                    sols.sort((s1, s2) => {
                      const score = s => (s.includes('÷') ? 2 : 0) + (s.includes('×') ? 1 : 0);
                      return score(s1) - score(s2);
                    });
                    puzzlePool.push({
                      nums: tuple,
                      solutions: sols
                    });
                  }
                }
              }
            }
          }
        }
      }

      function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = copy[i];
          copy[i] = copy[j];
          copy[j] = temp;
        }
        return copy;
      }

      buildPool();

      const qEls = [
        document.getElementById('q1'),
        document.getElementById('q2'),
        document.getElementById('q3'),
        document.getElementById('q4')
      ];
      const actionBtn = document.getElementById('actionBtn');
      const solutionPanel = document.getElementById('solutionPanel');
      const solutionList = document.getElementById('solutionList');

      let currentPuzzle = null;
      let isSolutionShown = false;
      let lastIndex = -1;

      function loadNextPuzzle() {
        let idx = Math.floor(Math.random() * puzzlePool.length);
        if (puzzlePool.length > 1 && idx === lastIndex) {
          idx = (idx + 1) % puzzlePool.length;
        }
        lastIndex = idx;
        currentPuzzle = puzzlePool[idx];

        const arranged = shuffleArray(currentPuzzle.nums);
        for (let i = 0; i < 4; i++) {
          qEls[i].textContent = arranged[i];
        }

        // Reset state: require viewing solution before moving to next question
        isSolutionShown = false;
        solutionPanel.classList.remove('visible');
        solutionList.innerHTML = '';
        actionBtn.textContent = 'Show Solution';
      }

      function revealSolution() {
        if (!currentPuzzle) return;
        solutionList.innerHTML = '';

        // Display up to 4 clearest distinct solutions (always at least 2)
        const displaySolutions = currentPuzzle.solutions.slice(0, 4);
        displaySolutions.forEach((sol, idx) => {
          const li = document.createElement('li');
          li.textContent = `Method ${idx + 1}:  ${sol}`;
          solutionList.appendChild(li);
        });

        solutionPanel.classList.add('visible');
        isSolutionShown = true;
        actionBtn.textContent = 'Next Puzzle';
      }

      actionBtn.addEventListener('click', function () {
        if (!isSolutionShown) {
          revealSolution();
        } else {
          loadNextPuzzle();
        }
      });

      loadNextPuzzle();
    })();
  </script>
</body>
</html>
